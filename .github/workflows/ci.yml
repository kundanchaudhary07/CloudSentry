name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies and Ruff
        run: python -m pip install -r requirements.txt ruff
        working-directory: backend
      - name: Lint backend
        run: ruff check app tests
        working-directory: backend
      - name: Run backend tests
        run: pytest
        working-directory: backend

  frontend:
    name: Frontend lint and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run lint
        working-directory: frontend
      - run: npm run build
        working-directory: frontend

  iac-security:
    name: Terraform validation and Checkov
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"
      - name: Check Terraform formatting
        run: terraform fmt -check -recursive terraform
      - name: Initialize Terraform
        run: terraform -chdir=terraform init -backend=false -input=false
      - name: Validate Terraform
        run: terraform -chdir=terraform validate
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Checkov
        run: python -m pip install checkov
      - name: Scan Terraform configuration
        run: checkov -d terraform/ --framework terraform

  container-security:
    name: Container build and Trivy scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image
        run: docker build -t cloudsentry-backend:ci ./backend
      - name: Build frontend image
        run: docker build -t cloudsentry-frontend:ci ./frontend
      - name: Scan backend image
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: cloudsentry-backend:ci
          format: table
          severity: CRITICAL
          exit-code: "1"
      - name: Scan frontend image
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: cloudsentry-frontend:ci
          format: table
          severity: CRITICAL
          exit-code: "1"
